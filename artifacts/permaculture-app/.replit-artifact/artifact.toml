kind = "web"
previewPath = "/"
title = "Permaculture Designer"
version = "1.0.0"
id = "artifacts/permaculture-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21635

[services.development]
run = "pnpm --filter @workspace/permaculture-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/permaculture-app", "run", "build" ]
publicDir = "artifacts/permaculture-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21635"
BASE_PATH = "/"
