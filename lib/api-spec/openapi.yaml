      required: [layerKey, plateImage]
      properties:
        layerKey:
          type: string
          description: Which design layer this render represents (e.g. boundary, water, zones, sectors, structures, soil, composite).
        style:
          type: string
          description: Concept style preset key.
        plateImage:
          type: string
          description: Base64 PNG (data URL or raw base64) of the accurate plan plate to restyle.
        prompt:
          type: string
          description: Optional extra style direction appended to the base prompt.
        sourceHash:
          type: string
          description: Content hash of the layer's source data at generation time, used to detect staleness.
    PlanRenderItem:
      type: object
      required: [id, propertyId, layerKey, style, objectPath, url, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        layerKey:
          type: string
        style:
          type: string
        objectPath:
          type: string
        url:
          type: string
          description: Server path to fetch the rendered image.
        prompt:
          type: string
          nullable: true
        sourceHash:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
    PlanRenderList:
      type: array
      items:
        $ref: '#/components/schemas/PlanRenderItem'
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
