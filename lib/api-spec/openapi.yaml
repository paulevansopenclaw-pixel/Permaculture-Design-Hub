    PlantGuild:
      type: object
      required: [role, commonName, scientificName, rationale, heightM, spreadM, yearsToMaturity]
      properties:
        role:
          type: string
        commonName:
          type: string
        scientificName:
          type: string
        rationale:
          type: string
        heightM:
          type: number
          description: Mature height in metres
        spreadM:
          type: number
          description: Mature canopy or ground-cover spread radius in metres
        yearsToMaturity:
          type: number
          description: Approximate years to reach functional maturity

    ComprehensivePlant:
      type: object
      required: [layer, role, commonName, scientificName, heightM, spreadM, yearsToMaturity, notes]
      properties:
        layer:
          type: string
          description: Forest garden layer — Canopy | Sub-Canopy | Shrub | Herbaceous | Ground Cover | Climber | Root Zone
        role:
          type: string
        commonName:
          type: string
        scientificName:
          type: string
        heightM:
          type: number
          description: Mature height in metres
        spreadM:
          type: number
          description: Mature canopy or ground-cover spread radius in metres
        yearsToMaturity:
          type: number
          description: Approximate years to reach functional maturity
        notes:
          type: string
          description: Brief note on uses, benefits, or planting considerations

    SpatialRecommendation:
      type: object
      required: [element, placement, rationale]
      properties:
        element:
          type: string
        placement:
          type: string
        rationale:
          type: string

    SiteAnalysisReport:
      type: object
      required: [propertyId, WaterStrategy, SunAndEnergy, LandAndBiodiversity, ClimateResilience, generatedAt, rawJson]
      properties:
        propertyId:
          type: string
        WaterStrategy:
          description: Water catchment, tank sizing, and swale/drainage placement
        SunAndEnergy:
          description: Solar optimisation, microclimate, and thermal mass strategies
        LandAndBiodiversity:
          description: Soil protection, erosion mitigation, and caloric planting
        ClimateResilience:
          description: Extreme-weather and grid-collapse resilience summary with immediate action steps
        InfrastructureCritique:
          description: Localised critiques of drawn structures, swales, and sensory vectors — conflicts, risks, relocation recommendations
        PatternStrategy:
          type: object
          description: "Design from patterns to details — recommended primary spatial pattern for this site"
          properties:
            recommendedPattern:
              type: string
              description: Name of the recommended pattern (e.g. Fibonacci Spiral, Keyhole, Branching Net-and-Pan, Wind Sector Wedge)
            rationale:
              type: string
              description: Why nature uses this shape and why it suits this specific site
            application:
              type: string
              description: Concrete physical instructions for implementing the pattern on this site
        DesignRecommendations:
          type: object
          description: "Final compiled design — plant palette, design elements, and implementation phases synthesised from all site data"
          properties:
            plantingPrinciples:
              type: string
              description: Overall planting philosophy and layering strategy for this site
            plants:
              type: array
              items:
                type: object
                properties:
                  name:       { type: string }
                  latinName:  { type: string }
                  layer:      { type: string, description: "Canopy | Understory | Shrub | Herbaceous | Ground Cover | Vine | Root" }
                  purpose:    { type: string, description: "Primary function — food, nitrogen-fix, windbreak, medicine, habitat, etc." }
                  zones:      { type: string, description: "Permaculture zone placement e.g. Zone 1–2" }
                  notes:      { type: string, description: "Planting notes, spacing, climate caveats" }
            designElements:
              type: array
              items:
                type: object
                properties:
                  type:        { type: string, description: "e.g. Swale, Dam, Windbreak, Keyhole Bed, Compost System, Greenhouse, Chicken Tractor Circuit" }
                  name:        { type: string }
                  description: { type: string }
                  rationale:   { type: string }
                  placement:   { type: string, description: "Cardinal direction, zone, or relation to existing structures" }
                  priority:    { type: string, description: "High | Medium | Low" }
            implementationPhases:
              type: array
              items:
                type: object
                properties:
                  phase:     { type: number }
                  title:     { type: string }
                  duration:  { type: string, description: "e.g. Month 1–3" }
                  elements:  { type: array, items: { type: string } }
                  rationale: { type: string }
        climateSource:
          type: string
          description: Whether climate data was fetched live or failed
        autoCreatedWindSector:
          type: boolean
          description: True when the server automatically created a damaging-wind sector from the prevailing wind direction
        generatedAt:
          type: string
        rawJson:
          type: string

    WaterBudgetReport:
      type: object
      required: [propertyId, roofAreaM2, annualCatchmentKL, occupants]
      properties:
        propertyId:
          type: string
        roofAreaM2:
          type: number
        annualCatchmentKL:
          type: number
        occupants:
          type: number
        HouseholdBudget:
          type: object
          description: Household water demand with 20% buffer
          properties:
            adjustedDailyLitresPerPerson:
              type: number
            adjustedDailyTotalLitres:
              type: number
            annualHouseholdKL:
              type: number
            contingencyBufferKL:
              type: number
            totalHouseholdAllocationKL:
              type: number
            catchmentSurplusOrDeficitKL:
              type: number
            assessment:
              type: string
        TankConfiguration:
          type: object
          description: Recommended tank sizes and placement strategy
          properties:
            designDryDays:
              type: number
            recommendedTotalCapacityKL:
              type: number
            tanks:
              type: array
              items:
                type: object
                properties:
                  label:
                    type: string
                  capacityKL:
                    type: number
                  purpose:
                    type: string
                  material:
                    type: string
                  placementNote:
                    type: string
            designRationale:
              type: string
        FoodProductionBudget:
          type: object
          description: Max sustainable food production area from surplus water
          properties:
            availableIrrigationKL:
              type: number
            vegetableBedIrrigationLPerM2:
              type: number
            orchardIrrigationLPerM2:
              type: number
            maxVegetableBedM2:
              type: number
            maxOrchardM2:
              type: number
            recommendedSplit:
              type: object
              properties:
                vegetablesM2:
                  type: number
                orchardM2:
                  type: number
                totalM2:
                  type: number
                totalHa:
                  type: number
            irrigationEfficiencyNote:
              type: string
        RiskAssessment:
          type: object
          description: Drought scenario analysis
          properties:
            reducedRainfallMm:
              type: number
            reducedCatchmentKL:
              type: number
            systemDeficitKL:
              type: number
              nullable: true
            droughtRiskLevel:
              type: string
            contingencyMeasures:
              type: array
              items:
                type: string

