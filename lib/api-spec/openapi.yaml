openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Collaborative Permaculture Design API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Property boundary management
  - name: comments
    description: Feedback pins and comments
  - name: structures
    description: Property structure markers
  - name: sectors
    description: Permaculture sector analysis wedges
  - name: swales
    description: Designed swale / water-path layers
  - name: client-brief
    description: Onboarding site survey linked to a property
  - name: pathways
    description: Access roads, footpaths, farm tracks and fencelines
  - name: zones
    description: Permaculture zone analysis polygons

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"

    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a single property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found

    put:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found

    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{id}/stats:
    get:
      operationId: getPropertyStats
      tags: [properties]
      summary: Get stats for a property (area, comment count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyStats"

  /properties/{propertyId}/structures:
    get:
      operationId: listStructures
      tags: [structures]
      summary: List all structures for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of structures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Structure"

    post:
      operationId: createStructure
      tags: [structures]
      summary: Add a structure marker to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructureInput"
      responses:
        "201":
          description: Created structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Structure"

  /properties/{propertyId}/structures/{structureId}:
    patch:
      operationId: updateStructure
      tags: [structures]
      summary: Update a structure label or type
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: structureId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructureUpdate"
      responses:
        "200":
          description: Updated structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Structure"
        "404":
          description: Not found

    delete:
      operationId: deleteStructure
      tags: [structures]
      summary: Delete a structure marker
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: structureId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      summary: List all sector wedges for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"

    post:
      operationId: createSector
      tags: [sectors]
      summary: Add a sector wedge to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorInput"
      responses:
        "201":
          description: Created sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"

  /properties/{propertyId}/sectors/{sectorId}:
    patch:
      operationId: updateSector
      tags: [sectors]
      summary: Update a sector wedge
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorUpdate"
      responses:
        "200":
          description: Updated sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
        "404":
          description: Not found

    delete:
      operationId: deleteSector
      tags: [sectors]
      summary: Delete a sector wedge
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/client-brief:
    get:
      operationId: getClientBrief
      tags: [client-brief]
      summary: Get the client brief / site survey for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBrief"
        "404":
          description: Not found

    put:
      operationId: upsertClientBrief
      tags: [client-brief]
      summary: Create or update the client brief for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientBriefInput"
      responses:
        "200":
          description: Saved client brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBrief"

  /properties/{propertyId}/pathways:
    get:
      operationId: listPathways
      tags: [pathways]
      summary: List all access pathways for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of pathways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pathway"

    post:
      operationId: createPathway
      tags: [pathways]
      summary: Save an access pathway
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathwayInput"
      responses:
        "201":
          description: Created pathway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pathway"

  /properties/{propertyId}/pathways/{pathwayId}:
    delete:
      operationId: deletePathway
      tags: [pathways]
      summary: Delete an access pathway
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: pathwayId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/swales:
    get:
      operationId: listDesignedSwales
      tags: [swales]
      summary: List all designed swale lines for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of designed swales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignedSwale"

    post:
      operationId: createDesignedSwale
      tags: [swales]
      summary: Save a designed swale line
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignedSwaleInput"
      responses:
        "201":
          description: Created swale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignedSwale"

  /properties/{propertyId}/swales/{swaleId}:
    delete:
      operationId: deleteDesignedSwale
      tags: [swales]
      summary: Delete a designed swale line
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: swaleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List all feedback pins for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

    post:
      operationId: createComment
      tags: [comments]
      summary: Add a feedback pin to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /properties/{propertyId}/comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a feedback pin
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/zones:
    get:
      operationId: listZones
      tags: [zones]
      summary: List all zones for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"

    put:
      operationId: bulkReplaceZones
      tags: [zones]
      summary: Bulk-replace all zones for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ZoneInput"
      responses:
        "200":
          description: Replaced zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"

  /properties/{propertyId}/zones/{zoneId}:
    delete:
      operationId: deleteZone
      tags: [zones]
      summary: Delete a single zone
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Property:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        boundaryGeojson:
          type: ["object", "null"]
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]
        createdAt:
          type: string

    PropertyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        boundaryGeojson:
          type: ["object", "null"]
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]

    PropertyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        boundaryGeojson:
          type: ["object", "null"]
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]

    PropertyStats:
      type: object
      required: [propertyId, commentCount]
      properties:
        propertyId:
          type: string
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]
        commentCount:
          type: integer

    Structure:
      type: object
      required: [id, propertyId, lng, lat, label, structureType, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        lng:
          type: number
        lat:
          type: number
        label:
          type: string
        structureType:
          type: string
        footprintGeojson:
          type: string
          nullable: true
        createdAt:
          type: string

    StructureInput:
      type: object
      required: [lng, lat, label, structureType]
      properties:
        lng:
          type: number
        lat:
          type: number
        label:
          type: string
          minLength: 1
        structureType:
          type: string
        footprintGeojson:
          type: string
          nullable: true

    StructureUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        structureType:
          type: string
        footprintGeojson:
          type: string
          nullable: true

    Sector:
      type: object
      required: [id, propertyId, sectorType, centerLng, centerLat, radiusKm, startAngle, endAngle, label, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        sectorType:
          type: string
        centerLng:
          type: number
        centerLat:
          type: number
        radiusKm:
          type: number
        startAngle:
          type: integer
        endAngle:
          type: integer
        label:
          type: string
        createdAt:
          type: string

    SectorInput:
      type: object
      required: [sectorType, centerLng, centerLat, radiusKm, startAngle, endAngle, label]
      properties:
        sectorType:
          type: string
        centerLng:
          type: number
        centerLat:
          type: number
        radiusKm:
          type: number
        startAngle:
          type: integer
        endAngle:
          type: integer
        label:
          type: string

    SectorUpdate:
      type: object
      properties:
        sectorType:
          type: string
        centerLng:
          type: number
        centerLat:
          type: number
        radiusKm:
          type: number
        startAngle:
          type: integer
        endAngle:
          type: integer
        label:
          type: string

    ClientBrief:
      type: object
      required: [id, propertyId, machineryWidthM, utilitiesOverheadPower, utilitiesBuriedPipes, utilitiesLegalEasements, utilitiesActiveWell, challengeSevereErosion, challengeWinterFlooding, challengeHighWind, challengeWildlifePressure, createdAt, updatedAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        annualRainfallMm:
          type: number
          nullable: true
        estimatedSoilType:
          type: string
          nullable: true
        climateZone:
          type: string
          nullable: true
        machineryWidthM:
          type: number
        utilitiesOverheadPower:
          type: boolean
        utilitiesBuriedPipes:
          type: boolean
        utilitiesLegalEasements:
          type: boolean
        utilitiesActiveWell:
          type: boolean
        challengeSevereErosion:
          type: boolean
        challengeWinterFlooding:
          type: boolean
        challengeHighWind:
          type: boolean
        challengeWildlifePressure:
          type: boolean
        primaryGoal:
          type: string
          nullable: true
        maintenanceCapacity:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string

    ClientBriefInput:
      type: object
      required: [machineryWidthM, utilitiesOverheadPower, utilitiesBuriedPipes, utilitiesLegalEasements, utilitiesActiveWell, challengeSevereErosion, challengeWinterFlooding, challengeHighWind, challengeWildlifePressure]
      properties:
        annualRainfallMm:
          type: number
          nullable: true
        estimatedSoilType:
          type: string
          nullable: true
        climateZone:
          type: string
          nullable: true
        machineryWidthM:
          type: number
        utilitiesOverheadPower:
          type: boolean
        utilitiesBuriedPipes:
          type: boolean
        utilitiesLegalEasements:
          type: boolean
        utilitiesActiveWell:
          type: boolean
        challengeSevereErosion:
          type: boolean
        challengeWinterFlooding:
          type: boolean
        challengeHighWind:
          type: boolean
        challengeWildlifePressure:
          type: boolean
        primaryGoal:
          type: string
          nullable: true
        maintenanceCapacity:
          type: string
          nullable: true

    Zone:
      type: object
      required: [id, propertyId, zoneNumber, zoneGeojson, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        zoneNumber:
          type: integer
        zoneGeojson:
          type: string
        createdAt:
          type: string

    ZoneInput:
      type: object
      required: [zoneNumber, zoneGeojson]
      properties:
        zoneNumber:
          type: integer
          minimum: 1
          maximum: 5
        zoneGeojson:
          type: string

    Pathway:
      type: object
      required: [id, propertyId, label, pathwayType, lineGeojson, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        label:
          type: string
        pathwayType:
          type: string
        lineGeojson:
          type: string
        createdAt:
          type: string

    PathwayInput:
      type: object
      required: [label, pathwayType, lineGeojson]
      properties:
        label:
          type: string
          minLength: 1
        pathwayType:
          type: string
        lineGeojson:
          type: string

    DesignedSwale:
      type: object
      required: [id, propertyId, name, geojsonLinestring, elevationM, lengthM, swaleType, notes, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        name:
          type: string
        geojsonLinestring:
          type: string
        elevationM:
          type: number
        lengthM:
          type: number
        swaleType:
          type: string
        notes:
          type: string
        createdAt:
          type: string

    DesignedSwaleInput:
      type: object
      required: [name, geojsonLinestring, elevationM, lengthM, swaleType, notes]
      properties:
        name:
          type: string
          minLength: 1
        geojsonLinestring:
          type: string
        elevationM:
          type: number
        lengthM:
          type: number
        swaleType:
          type: string
        notes:
          type: string

    Comment:
      type: object
      required: [id, propertyId, lng, lat, text, authorRole, createdAt]
      properties:
        id:
          type: string
        propertyId:
          type: string
        lng:
          type: number
        lat:
          type: number
        text:
          type: string
        authorRole:
          type: string
        createdAt:
          type: string

    CommentInput:
      type: object
      required: [lng, lat, text, authorRole]
      properties:
        lng:
          type: number
        lat:
          type: number
        text:
          type: string
        authorRole:
          type: string
