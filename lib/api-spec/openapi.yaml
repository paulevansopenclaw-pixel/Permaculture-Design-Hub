openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Collaborative Permaculture Design API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: properties
    description: Property boundary management
  - name: comments
    description: Feedback pins and comments
  - name: structures
    description: Property structure markers
  - name: sectors
    description: Permaculture sector analysis wedges
  - name: swales
    description: Designed swale / water-path layers
  - name: client-brief
    description: Onboarding site survey linked to a property
  - name: pathways
    description: Access roads, footpaths, farm tracks and fencelines
  - name: zones
    description: Permaculture zone analysis polygons
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: sensory-vectors
    description: Subjective sensory input vectors (noise, view corridors, privacy threats)
  - name: Auth
    description: Browser and mobile authentication endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List all properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"

    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a new property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a single property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found

    put:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found

    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{id}/stats:
    get:
      operationId: getPropertyStats
      tags: [properties]
      summary: Get stats for a property (area, comment count)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyStats"

  /properties/{propertyId}/structures:
    get:
      operationId: listStructures
      tags: [structures]
      summary: List all structures for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of structures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Structure"

    post:
      operationId: createStructure
      tags: [structures]
      summary: Add a structure marker to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructureInput"
      responses:
        "201":
          description: Created structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Structure"

  /properties/{propertyId}/structures/{structureId}:
    patch:
      operationId: updateStructure
      tags: [structures]
      summary: Update a structure label or type
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: structureId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructureUpdate"
      responses:
        "200":
          description: Updated structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Structure"
        "404":
          description: Not found

    delete:
      operationId: deleteStructure
      tags: [structures]
      summary: Delete a structure marker
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: structureId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      summary: List all sector wedges for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"

    post:
      operationId: createSector
      tags: [sectors]
      summary: Add a sector wedge to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorInput"
      responses:
        "201":
          description: Created sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"

  /properties/{propertyId}/sectors/{sectorId}:
    patch:
      operationId: updateSector
      tags: [sectors]
      summary: Update a sector wedge
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorUpdate"
      responses:
        "200":
          description: Updated sector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
        "404":
          description: Not found

    delete:
      operationId: deleteSector
      tags: [sectors]
      summary: Delete a sector wedge
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/analyze-site:
    post:
      operationId: analyzeSite
      tags: [client-brief]
      summary: Run AI site analysis and return + persist the report
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI analysis report saved to client brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAnalysisReport"
        "404":
          description: Property or client brief not found
        "500":
          description: AI analysis failed

  /properties/{propertyId}/water-budget:
    post:
      operationId: runWaterBudget
      tags: [client-brief]
      summary: Run AI water budget — household needs, tank sizing, and max food production area
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Water budget analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterBudgetReport"
        "404":
          description: Property or brief not found
        "500":
          description: AI analysis failed

  /properties/{propertyId}/client-brief:
    get:
      operationId: getClientBrief
      tags: [client-brief]
      summary: Get the client brief / site survey for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBrief"
        "404":
          description: Not found

    put:
      operationId: upsertClientBrief
      tags: [client-brief]
      summary: Create or update the client brief for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientBriefInput"
      responses:
        "200":
          description: Saved client brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBrief"

  /properties/{propertyId}/pathways:
    get:
      operationId: listPathways
      tags: [pathways]
      summary: List all access pathways for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of pathways
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pathway"

    post:
      operationId: createPathway
      tags: [pathways]
      summary: Save an access pathway
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathwayInput"
      responses:
        "201":
          description: Created pathway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pathway"

  /properties/{propertyId}/pathways/{pathwayId}:
    delete:
      operationId: deletePathway
      tags: [pathways]
      summary: Delete an access pathway
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: pathwayId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/swales:
    get:
      operationId: listDesignedSwales
      tags: [swales]
      summary: List all designed swale lines for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of designed swales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DesignedSwale"

    post:
      operationId: createDesignedSwale
      tags: [swales]
      summary: Save a designed swale line
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignedSwaleInput"
      responses:
        "201":
          description: Created swale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignedSwale"

  /properties/{propertyId}/swales/{swaleId}:
    delete:
      operationId: deleteDesignedSwale
      tags: [swales]
      summary: Delete a designed swale line
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: swaleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List all feedback pins for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

    post:
      operationId: createComment
      tags: [comments]
      summary: Add a feedback pin to a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /properties/{propertyId}/comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a feedback pin
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/zones:
    get:
      operationId: listZones
      tags: [zones]
      summary: List all zones for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"

    put:
      operationId: bulkReplaceZones
      tags: [zones]
      summary: Bulk-replace all zones for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ZoneInput"
      responses:
        "200":
          description: Replaced zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"

  /properties/{propertyId}/zones/{zoneId}:
    delete:
      operationId: deleteZone
      tags: [zones]
      summary: Delete a single zone
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /properties/{propertyId}/sensory-vectors:
    get:
      operationId: listSensoryVectors
      tags: [sensory-vectors]
      summary: List all sensory vectors for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sensory vectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensoryVector"
    post:
      operationId: createSensoryVector
      tags: [sensory-vectors]
      summary: Create a sensory vector
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensoryVectorInput"
      responses:
        "201":
          description: Created sensory vector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensoryVector"

  /properties/{propertyId}/sensory-vectors/{vectorId}:
    delete:
      operationId: deleteSensoryVector
      tags: [sensory-vectors]
      summary: Delete a sensory vector
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
        - name: vectorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /properties/{propertyId}/concept-render:
    post:
      operationId: generateConceptRender
      tags: [client-brief]
      summary: Restyle an accurate plan plate into AI concept art (image-to-image)
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptRenderRequest'
      responses:
        '200':
          description: Concept render generated and cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRenderItem'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Property not found.
        '500':
          description: Concept render failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /properties/{propertyId}/plan-renders:
    get:
      operationId: listPlanRenders
      tags: [client-brief]
      summary: List cached AI concept renders for a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cached concept renders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRenderList'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Property:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        boundaryGeojson:
          type: ["object", "null"]
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]
        tileImage:
          type: ["string", "null"]
        createdAt:
          type: string

    PropertyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        boundaryGeojson:
          type: ["object", "null"]
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]
        tileImage:
          type: ["string", "null"]

    PropertyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        boundaryGeojson:
          type: ["object", "null"]
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]
        tileImage:
          type: ["string", "null"]

    PropertyStats:
      type: object
      required: [propertyId, commentCount]
      properties:
        propertyId:
          type: string
        areaHectares:
          type: ["number", "null"]
        areaAcres:
          type: ["number", "null"]
        commentCount:
          type: integer

    Structure:
      type: object
